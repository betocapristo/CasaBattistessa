<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plano:#e6e9ec;--hoja:#ffffff;--tinta:#141d26;--grafito:#4a5663;--tenue:#66717d;
  --linea:#dde1e5;--trazo:#aeb7c0;--azul:#1f5fa8;--azul-bg:#e8f0fa;
  --riel:#101820;--riel-tx:#c9d1d9;--riel-ac:#ffffff;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--prog:#aeb7c0;
  --ok:#006300;--warn:#fab219;--warn-tx:#6b4a00;--serio:#ec835a;--crit:#d03b3b;--crit-tx:#a32424;
  --bad-bg:#fbeceb;--warn-bg:#fff5da;--info-bg:#eaf1f8;
  --fuente-t:"Archivo","Arial Narrow",system-ui,sans-serif;
  --fuente-c:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --plano:#0b1015;--hoja:#151c23;--tinta:#eceff2;--grafito:#b4bdc6;--tenue:#8d98a3;
    --linea:#26303a;--trazo:#3b4753;--azul:#6aa5ee;--azul-bg:#1b2a3c;
    --riel:#0a0f14;--riel-tx:#a9b3bd;--riel-ac:#ffffff;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--prog:#4b5864;
    --ok:#0ca30c;--warn-tx:#f3c969;--crit-tx:#f19a9a;
    --bad-bg:#2c1717;--warn-bg:#2b2412;--info-bg:#17222e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plano:#0b1015;--hoja:#151c23;--tinta:#eceff2;--grafito:#b4bdc6;--tenue:#8d98a3;
  --linea:#26303a;--trazo:#3b4753;--azul:#6aa5ee;--azul-bg:#1b2a3c;
  --riel:#0a0f14;--riel-tx:#a9b3bd;--riel-ac:#ffffff;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--prog:#4b5864;
  --ok:#0ca30c;--warn-tx:#f3c969;--crit-tx:#f19a9a;
  --bad-bg:#2c1717;--warn-bg:#2b2412;--info-bg:#17222e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plano);color:var(--tinta);font:15px/1.5 var(--fuente-c);font-feature-settings:"tnum" 1,"lnum" 1}
h1,h2,h3,h4{font-family:var(--fuente-t);font-stretch:82%;font-variation-settings:"wdth" 82;font-weight:600;margin:0;letter-spacing:.005em}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* ---- riel ---- */
.riel{background:var(--riel);color:var(--riel-tx);padding:22px 0 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.marca{padding:0 22px 18px;border-bottom:1px solid #26323e;margin-bottom:10px}
.marca b{display:block;font:600 19px/1.15 var(--fuente-t);font-variation-settings:"wdth" 80;color:var(--riel-ac)}
.marca span{font-size:13px;color:#8f9ba6}
.grupo{margin:14px 0 4px;padding:0 22px;font-size:12.5px;color:#7c8894;letter-spacing:.02em}
.riel button.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--riel-tx);padding:7px 22px 7px 19px;font:inherit;font-size:15px;cursor:pointer}
.riel button.nav:hover{background:#17212b;color:#fff}
.riel button.nav.on{border-left-color:#6aa5ee;background:#17212b;color:#fff;font-weight:600}
.riel .pie{margin-top:auto;padding:14px 22px 0;border-top:1px solid #26323e;font-size:12.5px;color:#8f9ba6;line-height:1.4}
/* ---- hoja ---- */
.lado{padding:22px 24px 40px;min-width:0}
.hoja{max-width:1320px;margin:0 auto;background:var(--hoja);border:1px solid var(--trazo);position:relative;padding:26px 30px 34px}
.hoja::before{content:"";position:absolute;inset:5px;border:1px solid var(--linea);pointer-events:none}
.hoja>*{position:relative}
.rotulo{display:grid;grid-template-columns:2.2fr 1.3fr 1.5fr 1.2fr 1fr;border:1.5px solid var(--tinta);margin-bottom:26px}
.rotulo>div{padding:7px 12px 8px;border-right:1px solid var(--tinta);border-bottom:1px solid var(--tinta);min-width:0}
.rotulo>div:nth-child(5n){border-right:0}
.rotulo>div:nth-last-child(-n+5){border-bottom:0}
.rotulo small{display:block;font-size:12px;color:var(--tenue);line-height:1.2}
.rotulo b{display:block;font:600 17px/1.25 var(--fuente-t);font-variation-settings:"wdth" 85;overflow-wrap:anywhere}
.rotulo .grande b{font-size:22px}
.rotulo .lamina b{color:var(--azul)}
.seg{display:inline-flex;border:1px solid var(--tinta);margin-top:2px}
.seg button{background:transparent;color:var(--tinta);border:0;padding:3px 14px;cursor:pointer;font:600 14px var(--fuente-c)}
.seg button.on{background:var(--tinta);color:var(--hoja)}
.titulo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 14px}
.titulo h2{font-size:25px}
.titulo .sp{flex:1}
.sub{color:var(--grafito);margin:-6px 0 16px;max-width:75ch}
h3.sec{font-size:17px;margin:30px 0 4px}
h3.sec+.nota{margin-top:0}
.nota{font-size:13.5px;color:var(--tenue);margin:6px 0 12px;max-width:80ch}
hr.fino{border:0;border-top:1px solid var(--linea);margin:26px 0}
/* ---- lecturas ---- */
.lect{display:flex;flex-wrap:wrap;border-top:1.5px solid var(--tinta);border-bottom:1px solid var(--linea);margin:6px 0 8px}
.lect>div{flex:1 1 170px;padding:12px 18px 12px 0;margin-right:18px;border-right:1px solid var(--linea);min-width:0}
.lect>div:last-child{border-right:0;margin-right:0}
.lect small{display:block;font-size:13px;color:var(--grafito)}
.lect b{display:block;font:600 28px/1.15 var(--fuente-t);font-variation-settings:"wdth" 82;margin:2px 0}
.lect em{font-style:normal;font-size:13px;color:var(--tenue)}
.pos{color:var(--ok)}.neg{color:var(--crit-tx)}
/* ---- barras de bala ---- */
.bl{display:grid;grid-template-columns:210px 1fr 230px;gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--linea)}
.bl-lab{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-bar{position:relative;height:18px}
.bl-track{position:absolute;left:0;top:5px;height:8px;background:var(--linea);border:1px solid var(--trazo)}
.bl-seg{position:absolute;top:2px;height:14px}
.bl-seg.p{background:var(--s1)}.bl-seg.q{background:var(--s2)}
.bl-tick{position:absolute;top:0;height:18px;width:2px;background:var(--tinta)}
.bl-val{font-size:13.5px;text-align:right;color:var(--grafito);white-space:nowrap}
.bl-val b{color:var(--tinta)}
.leyenda{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--grafito);margin:6px 0 10px}
.leyenda i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
@media(max-width:760px){.bl{grid-template-columns:1fr}.bl-val{text-align:left}}
/* ---- tablas ---- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;font-size:13px;color:var(--grafito);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--tinta);white-space:nowrap;position:sticky;top:0;background:var(--hoja)}
td{padding:7px 10px;border-bottom:1px solid var(--linea);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr:hover>td{background:color-mix(in srgb,var(--azul-bg) 55%,transparent)}
tr.sub td{font-weight:600;background:color-mix(in srgb,var(--linea) 45%,transparent);border-bottom-color:var(--trazo)}
tr.tot td{font-weight:700;border-top:1.5px solid var(--tinta);border-bottom:0}
td.dos small{display:block;color:var(--tenue);font-size:12.5px;line-height:1.2}
.ind{padding-left:24px}
/* ---- controles ---- */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.tools .sp{flex:1}
.btn{font:600 14px var(--fuente-c);cursor:pointer;border:1px solid var(--tinta);background:transparent;color:var(--tinta);padding:6px 13px;border-radius:2px}
.btn:hover{background:var(--linea)}
.btn.pri{background:var(--tinta);color:var(--hoja)}
.btn.pri:hover{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.mini{padding:2px 9px;font-size:12.5px;border-color:var(--trazo)}
.btn.del{color:var(--crit-tx);border-color:var(--trazo)}
input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--trazo);background:var(--hoja);color:var(--tinta);border-radius:2px;max-width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
label.in{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--grafito)}
.tag{display:inline-block;padding:1px 8px;font-size:12.5px;border:1px solid var(--trazo);color:var(--grafito);border-radius:2px;white-space:nowrap}
.tag.ok{border-color:var(--s3);color:var(--ok)}
.tag.q{border-color:var(--s2);color:var(--warn-tx)}
.tag.bad{border-color:var(--crit);color:var(--crit-tx);font-weight:600}
.tag.warn{border-color:var(--warn);color:var(--warn-tx);font-weight:600}
.hint{font-size:13px;color:var(--tenue)}
.vacio{padding:28px 6px;color:var(--tenue)}
.vis .edit{display:none!important}
/* ---- alertas ---- */
.al{border-left:4px solid;padding:10px 16px;margin:0 0 12px;font-size:14.5px}
.al h4{font:600 15px var(--fuente-c);margin:0 0 4px}
.al ul{margin:0;padding-left:18px}.al li{margin:2px 0}
.al.bad{background:var(--bad-bg);border-color:var(--crit)}.al.bad h4{color:var(--crit-tx)}
.al.warn{background:var(--warn-bg);border-color:var(--warn)}.al.warn h4{color:var(--warn-tx)}
.al.info{background:var(--info-bg);border-color:var(--azul)}.al.info h4{color:var(--azul)}
/* ---- fotos ---- */
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.th{position:relative}
.th img{width:84px;height:84px;object-fit:cover;border:1px solid var(--trazo);background:var(--linea);display:block}
.th button{position:absolute;top:-7px;right:-7px;border-radius:50%;width:22px;height:22px;padding:0;border:1px solid var(--trazo);background:var(--hoja);cursor:pointer;color:var(--crit-tx)}
.gal img{max-width:100%;margin-bottom:10px;border:1px solid var(--trazo);display:block}
.clip{cursor:pointer;white-space:nowrap;color:var(--azul);font-weight:600}
/* ---- modal ---- */
.ov{position:fixed;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.md{background:var(--hoja);border:1.5px solid var(--tinta);padding:22px;width:640px;max-width:100%;max-height:92vh;overflow:auto}
.md.ancho{width:860px}
.md h3{font-size:20px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.bt{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.chart{position:relative;height:300px}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:980px){.dosc{grid-template-columns:1fr}}
/* ---- gantt ---- */
.gw{border:1px solid var(--trazo);overflow:auto;max-height:74vh;position:relative}
.gb{position:relative}
.gr{display:flex;border-bottom:1px solid var(--linea)}
.gr.cab{position:sticky;top:0;z-index:5;background:var(--hoja);border-bottom:1.5px solid var(--tinta)}
.gl{position:sticky;left:0;z-index:3;flex:none;background:var(--hoja);padding:6px 12px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--trazo);font-size:14px}
.gl small{color:var(--tenue);font-size:12.5px}
.gr.et .gl{font:600 14.5px var(--fuente-t);background:color-mix(in srgb,var(--linea) 60%,var(--hoja))}
.gr.et .gl{font-variation-settings:"wdth" 85}
.gr.et .gx{background:color-mix(in srgb,var(--linea) 35%,transparent)}
.gx{position:relative;flex:none}
.gm{position:absolute;top:0;bottom:0;border-left:1px solid var(--linea);font-size:12.5px;color:var(--grafito);padding:2px 5px;white-space:nowrap}
.gm.a{border-left:1px solid var(--tinta);font-weight:600}
.gg{position:absolute;top:0;bottom:0;pointer-events:none;z-index:1}
.gg i{position:absolute;top:0;bottom:0;width:1px;background:var(--linea)}
.gg i.hoy{background:var(--crit);width:2px;opacity:.85}
.gbar{position:absolute;height:11px;top:8px;z-index:2}
.gbar.ej{background:var(--azul-bg);border:1px solid var(--azul)}
.gbar.ej u{position:absolute;left:0;top:0;bottom:0;background:var(--azul);opacity:.85}
.gbar.lead{background:repeating-linear-gradient(135deg,var(--trazo) 0 2px,transparent 2px 5px);border:1px solid var(--trazo)}
.gbar.etp{background:var(--tinta);height:7px;top:9px}
.gdi{position:absolute;width:11px;height:11px;border:2px solid var(--tinta);background:var(--hoja);transform:translate(-50%,0) rotate(45deg);z-index:3;top:25px}
.gdi.vencido{border-color:var(--crit)}
.gci{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,0);z-index:3;top:43px;border:2px solid var(--hoja)}
.gci.p{background:var(--s1)}.gci.q{background:var(--s2)}
.gsum{position:absolute;bottom:0;z-index:2;display:flex;align-items:flex-end;justify-content:center;font-size:11.5px;color:var(--grafito)}
.gsum i{display:block;width:calc(100% - 10px);}
#tip{position:fixed;z-index:80;background:var(--tinta);color:var(--hoja);padding:6px 10px;font-size:13px;max-width:320px;pointer-events:none;display:none;line-height:1.35}
/* ---- móvil ---- */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .riel{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px 8px}
  .marca{border:0;margin:0;padding:6px 12px;flex:1 1 100%}
  .grupo,.riel .pie{display:none}
  .riel button.nav{width:auto;padding:6px 12px;border-left:0;border-bottom:3px solid transparent}
  .riel button.nav.on{border-bottom-color:#6aa5ee}
  .lado{padding:10px 8px 30px}.hoja{padding:16px 14px 24px}
  .rotulo{grid-template-columns:1fr 1fr}
  .rotulo>div{border-bottom:1px solid var(--tinta)!important;border-right:1px solid var(--tinta)!important}
  .rotulo>div:nth-child(2n){border-right:0!important}
}
@media(prefers-reduced-motion:no-preference){.ov{animation:fa .12s ease-out}@keyframes fa{from{opacity:0}to{opacity:1}}}
@media print{.riel,.edit,.tools .btn,#modal{display:none!important}.app{display:block}.lado{padding:0}.hoja{border:0}}

.arch{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;width:110px;height:84px;padding:6px;border:1px solid var(--trazo);background:var(--linea);color:var(--tinta);text-decoration:none;text-align:center;overflow:hidden;cursor:pointer}
.arch b{font:600 15px var(--fuente-t);color:var(--azul);text-transform:lowercase}
.arch span{font-size:11px;line-height:1.2;overflow-wrap:anywhere;max-height:2.4em;overflow:hidden}
.arch.falta{opacity:.5}
.gal.thumbs .th img{width:auto;max-width:100%;height:auto;max-height:70vh;object-fit:contain}

.riel .pubbtn{margin:16px 22px 0;padding:10px 12px;background:#2f6fdc;color:#fff;border:0;font:600 14px var(--fuente-t);cursor:pointer;text-align:center}
.riel .pubbtn:hover{background:#4a85ec}
.riel .pubbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.riel .pubbtn+.pie{margin-top:14px}
@media(max-width:900px){.riel .pubbtn{margin:6px 8px;width:auto}}

tr.det td{padding:0 0 6px 24px;background:transparent;border-top:0}
tr.det summary{cursor:pointer;color:var(--azul);font-size:13px;padding:2px 0}
.det-t{width:auto;min-width:60%;margin:6px 0 4px;font-size:13px}
.det-t th,.det-t td{padding:3px 12px 3px 0;border:0;border-bottom:1px solid var(--linea)}
.items-box{border:1px solid var(--trazo);padding:10px;background:var(--hoja)}
.items-box table{width:100%;font-size:14px}
.items-box td{padding:3px 4px 3px 0;vertical-align:top}
.items-box input,.items-box select{width:100%;min-width:0}
.items-tot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:600}

</style>
</head>
<body>
<div class="app">
  <aside class="riel" id="riel"></aside>
  <div class="lado">
    <div class="hoja" id="hoja">
      <div class="rotulo" id="rotulo"></div>
      <main id="app"></main>
    </div>
  </div>
</div>
<div id="modal"></div>
<div id="tip"></div>
<input type="file" id="fJSON" accept=".json,.zip" hidden>
<input type="file" id="fXLSX" accept=".xlsx,.xls,.csv" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
/* ============ Constantes ============ */
const KEY = 'obra_casa_v1', KEY_MON = 'obra_casa_mon', KEY_DOL = 'obra_dolar_blue', KEY_SNAP = 'obra_casa_snaps',
  KEY_EXP = 'obra_last_export', KEY_GH = 'obra_gh', KEY_PUBF = 'obra_pub_fotos', KEY_SALT = 'obra_salt';
const _q = new URLSearchParams(location.search);
const VISOR = _q.has('visor') || (/github\.io$/.test(location.hostname) && !_q.has('editar'));
const MEDIOS = ['Efectivo', 'Transferencia', 'Cheque', 'Cuenta corriente', 'Tarjeta', 'Otro'];
const COMPROB = ['Factura A', 'Factura B', 'Factura C', 'Recibo / ticket', 'Sin comprobante'];
const IVAS = [['', 'Sin IVA discriminado'], ['21', '21 %'], ['10.5', '10,5 %'], ['27', '27 %'], ['0', 'Exento / 0 %']];
const ETAPAS_BASE = ['Preliminares y proyecto', 'Estructura', 'Cerramientos y techos', 'Instalaciones', 'Terminaciones', 'Exteriores y varios'];
const GREMIOS_BASE = [
  ['Honorarios y proyecto', 0], ['Movimiento de suelos', 0], ['Fundaciones y estructura', 1],
  ['Albañilería', 2], ['Techos y cubiertas', 2], ['Aberturas y herrería', 2],
  ['Instalación sanitaria', 3], ['Instalación eléctrica', 3], ['Instalación de gas', 3], ['Climatización', 3],
  ['Yesería / Durlock', 4], ['Pisos y revestimientos', 4], ['Pintura', 4], ['Carpintería y placares', 4],
  ['Paisajismo y exteriores', 5], ['Imprevistos y otros', 5]
];
/* Índice CAC (CAMARCO, base dic. 2014 = 100). Relevado de réplicas de la publicación; contrastar con la fuente oficial. */
const CAC_SEED = [
  ['2025-09', 17762.3, 14207.5, 20187.5], ['2025-10', 18172.8, 14408.8, 20740.8], ['2025-11', 18534.9, 14839.9, 21055.9],
  ['2025-12', 18776.5, 15026.2, 21335.3], ['2026-01', 19209.4, 15444.4, 21778.0], ['2026-02', 19453.0, 15708.2, 22007.9],
  ['2026-03', 19771.2, 16205.2, 22204.2], ['2026-04', 20493.2, 17009.6, 22870.0], ['2026-05', 21035.6, 17423.2, 23500.2],
  ['2026-06', 21734.5, 18557.6, 23901.9], ['2026-07', 22053.0, 18980.4, 24149.4], ['2026-08', 22945.2, 20167.9, 24840.0],
  ['2026-09', 23607.5, 20519.6, 25714.3]
].map(([mes, general, mo, mat]) => ({mes, general, mo, mat}));
const CAC_FUENTE = 'Indicador CAMARCO (Cámara Argentina de la Construcción), base dic. 2014 = 100. Valores tomados de réplicas publicadas (miobra.com.ar y aestrenar.com), con junio y julio de 2026 ya rectificados. Son provisorios: contrastarlos con la publicación oficial antes de ajustar un contrato.';
const CAC_TIPOS = [['', 'Sin ajuste por CAC'], ['general', 'CAC general'], ['mano de obra', 'CAC mano de obra'], ['materiales', 'CAC materiales']];
const CAC_COL = {general: 'general', 'mano de obra': 'mo', materiales: 'mat'};

/* ============ Utilidades ============ */
let S = null, VIEW = 'resumen', GROUP = 'gremio', FILT = {q: '', g: '', estado: '', p: ''}, CORTE = '', GZ = 3.4;
let charts = {}, after = [], FT = {lista: [], nuevas: [], quitadas: []}, ENC = false;

/* ============ Estado ============ */
function nuevoEstado() {
  const etapas = ETAPAS_BASE.map(nombre => ({id: uid(), nombre, inicio: '', dias: 0}));
  return {
    v: 5, rev: 0, actualizado: '',
    obra: {nombre: 'Casa del propietario', propietario: '', direccion: '', director: '', inicio: hoy(), tc: 1400, cerradoHasta: '', inflMensual: 0},
    etapas, gremios: GREMIOS_BASE.map(([nombre, i]) => ({id: uid(), nombre, etapaId: etapas[i].id})),
    partidas: [], modif: [], egresos: [], ingresos: [], cac: CAC_SEED.map(x => ({...x})), log: []

}
function migrar(d) {
  d.obra = Object.assign({nombre: '', propietario: '', direccion: '', director: '', inicio: hoy(), tc: 1400, cerradoHasta: '', inflMensual: 0}, d.obra || {});
  d.gremios = d.gremios || []; d.etapas = d.etapas || [];
  const et = n => { let e = d.etapas.find(x => x.nombre === n); if (!e) { e = {id: uid(), nombre: n, inicio: '', dias: 0}; d.etapas.push(e); } return e; };
  if (d.etapasInicio) { Object.entries(d.etapasInicio).forEach(([n, f]) => { et(n).inicio = f; }); delete d.etapasInicio; }
  if (!d.etapas.length) ETAPAS_BASE.forEach(n => et(n));
  d.gremios.forEach(g => { if (!g.etapaId) g.etapaId = et(g.etapa || ETAPAS_BASE[ETAPAS_BASE.length - 1]).id; delete g.etapa; });
  d.partidas = d.partidas || d.presupuesto || []; delete d.presupuesto;
  d.partidas.forEach(p => {
    p.fotos = p.fotos || []; p.sub = p.sub || ''; p.items = p.items || []; p.pagos = p.pagos || []; p.avance = +p.avance || 0; p.diasEntrega = +p.diasEntrega || 0;
    p.fechaCarga = p.fechaCarga || ''; p.fechaConf = p.fechaConf || ''; p.proveedor = p.proveedor || ''; p.cacTipo = p.cacTipo || ''; p.cacBase = p.cacBase || '';
    if (p.cron && p.cron.length && !p.pagos.length) p.pagos = p.cron.map(c => ({concepto: 'Cronograma', pct: p.monto ? c.monto / p.monto * 100 : 0, ref: 'fecha', dias: 0, fecha: c.mes + '-15'}));
    delete p.cron;
  });
  d.modif = d.modif || []; d.egresos = d.egresos || []; d.ingresos = d.ingresos || []; d.log = d.log || []; d.rev = d.rev || 0;
  d.egresos.forEach(e => { e.fotos = e.fotos || []; e.partidaId = e.partidaId || ''; e.compTipo = e.compTipo || ''; if (e.ivaPct === undefined) e.ivaPct = ''; });
  d.ingresos.forEach(i => { i.fotos = i.fotos || []; });
  d.modif.forEach(m => { m.fotos = m.fotos || []; });
  d.cac = d.cac || [];
  CAC_SEED.forEach(s => { if (!d.cac.some(c => c.mes === s.mes)) d.cac.push({...s}); });
  d.cac.sort((a, b) => a.mes.localeCompare(b.mes));
  d.v = 5; return d;
}

/* ============ Fotos (IndexedDB) ============ */
let _db;
function idb() {
  return _db || (_db = new Promise((res, rej) => {
    const r = indexedDB.open('obra_casa_fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function fPut(id, blob) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('f', 'readwrite'); t.objectStore('f').put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function fGet(id) { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction('f').objectStore('f').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function fDel(id) { try { const d = await idb(); return new Promise(res => { const t = d.transaction('f', 'readwrite'); t.objectStore('f').delete(id); t.oncomplete = res; t.onerror = res; }); } catch (e) { /* noop */ } }
function comprimir(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? res(b) : rej(); }, 'image/jpeg', 0.72);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(); };
    img.src = u;
  });
}

const MAX_ARCH = 25 * 1024 * 1024;
const esImg = t => /^image\/(jpeg|png|webp|bmp)$/.test(t || '');
async function guardarArchivo(file) {
  if (file.size > MAX_ARCH) throw new Error('«' + file.name + '» pesa más de 25 MB.');
  let blob = file, tipo = file.type || 'application/octet-stream';
  if (esImg(tipo)) { try { blob = await comprimir(file); tipo = 'image/jpeg'; } catch (e) { blob = file; } }
  const id = uid(); await fPut(id, blob);
  return {id, nombre: file.name, tipo};
}
/* ============ Cifrado (AES-GCM) para publicar ============ */
const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

let KEYC = null;
async function derivar(clave, salt) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
function saltLocal() { let s = lsGet(KEY_SALT, ''); if (!s) { s = b64(crypto.getRandomValues(new Uint8Array(16))); lsSet(KEY_SALT, s); } return unb64(s); }
async function cifrarBytes(bytes, key) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, bytes)); return {iv, ct}; }
async function descifrarBytes(iv, ct, key) { return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv}, key, ct)); }

/* ============ Cálculos ============ */
const gremio = id => S.gremios.find(g => g.id === id);
const etapa = id => S.etapas.find(e => e.id === id);
const partida = id => S.partidas.find(p => p.id === id);
const gNombre = id => (gremio(id) || {nombre: '(sin gremio)'}).nombre;
const eNombre = id => (etapa(id) || {nombre: '(sin etapa)'}).nombre;
const gEtapa = gid => eNombre((gremio(gid) || {}).etapaId);
const pNombre = id => { const p = partida(id); return p ? (p.desc || '(sin descripción)') : ''; };
const etapaFin = e => e && e.inicio && +e.dias > 0 ? addDias(e.inicio, +e.dias) : '';

function conv(monto, moneda, tc, to) {
  tc = tc || S.obra.tc || 1;
  if (moneda === to) return monto;
  return to === 'ARS' ? monto * tc : monto / tc;
}
const modifsDe = p => S.modif.filter(m => m.partidaId === p.id && m.aprobado);
const vigenteNat = p => p.monto + modifsDe(p).reduce((s, m) => s + m.monto, 0);
const origenM = (p, m) => conv(p.monto, p.moneda, p.tc, m);
const vPm = (p, m) => conv(p.monto, p.moneda, p.tc, m) + modifsDe(p).reduce((s, x) => s + conv(x.monto, p.moneda, x.tc || p.tc, m), 0);
const vP = p => vPm(p, MON);
const vEm = (e, m) => conv(e.importe, e.moneda, e.tc, m);
const vE = e => vEm(e, MON);
const ivaCont = e => (e.ivaPct !== '' && +e.ivaPct > 0) ? e.importe * (+e.ivaPct) / (100 + (+e.ivaPct)) : 0;

function ejecutadoNat(p) {
  let pag = 0, pen = 0;
  S.egresos.forEach(e => { if (e.partidaId !== p.id) return; const v = vEm(e, p.moneda); if (e.estado === 'Pagado') pag += v; else pen += v; });
  return {pag, pen, tot: pag + pen};
}

/* ---- Flujo de pagos acordado ---- */
function fechaBase(p, x) {
  if (x.ref === 'fecha') return x.fecha || '';
  if (x.ref === 'etapa') { const g = gremio(p.gremioId), e = g && etapa(g.etapaId); return (e && e.inicio) || ''; }
  if (x.ref === 'entrega') return p.fechaConf ? addDias(p.fechaConf, +p.diasEntrega || 0) : '';
  return p.fechaConf || '';
}
function pagosCalc(p) {
  const V = vigenteNat(p);
  return (p.pagos || []).map(x => { const b = fechaBase(p, x), f = b ? addDias(b, +x.dias || 0) : ''; return {...x, monto: V * (+x.pct || 0) / 100, fecha: f, mes: f.slice(0, 7)}; });
}
const planMeses = p => pagosCalc(p).filter(x => x.mes).map(x => ({mes: x.mes, monto: x.monto}));
function planPorMes() {
  const o = {};
  S.partidas.forEach(p => planMeses(p).forEach(x => { o[x.mes] = (o[x.mes] || 0) + conv(x.monto, p.moneda, p.tc, MON); }));
  return o;
}

/* ---- Agrupaciones ---- */
const subNombre = (gid, p) => gNombre(gid) + ' › ' + ((p && p.sub) || 'Sin subfamilia');
function claveEgreso(dim, e) {
  if (dim === 'gremio') return gNombre(e.gremioId);
  if (dim === 'sub') return subNombre(e.gremioId, partida(e.partidaId));
  if (dim === 'etapa') return gEtapa(e.gremioId);
  if (dim === 'proveedor') { const p = partida(e.partidaId); return (p && p.proveedor) || e.proveedor || '(sin proveedor)'; }
  if (dim === 'medio') return e.medio || '(sin medio)';
  return (e.fecha || '').slice(0, 7) || '(sin fecha)';
}
function agrupar(dim) {
  const m = {};
  const get = k => m[k] || (m[k] = {k, pres: 0, pag: 0, pen: 0, n: 0});
  const conPres = ['gremio', 'etapa', 'sub', 'proveedor'].includes(dim);
  if (conPres) {
    if (dim === 'gremio' || dim === 'etapa') S.gremios.forEach(g => get(dim === 'gremio' ? g.nombre : eNombre(g.etapaId)));
    S.partidas.forEach(p => { get(dim === 'gremio' ? gNombre(p.gremioId) : dim === 'sub' ? subNombre(p.gremioId, p) : dim === 'proveedor' ? (p.proveedor || '(sin proveedor)') : gEtapa(p.gremioId)).pres += vP(p); });
  }
  S.egresos.forEach(e => { const r = get(claveEgreso(dim, e)); if (e.estado === 'Pagado') r.pag += vE(e); else r.pen += vE(e); r.n++; });
  let arr = Object.values(m);
  if (dim === 'mes') arr.sort((a, b) => a.k.localeCompare(b.k));
  else if (dim === 'etapa') { const ord = S.etapas.map(e => e.nombre); arr.sort((a, b) => ord.indexOf(a.k) - ord.indexOf(b.k)); }
  else arr.sort((a, b) => (b.pag + b.pen + b.pres) - (a.pag + a.pen + a.pres));
  if (conPres) arr = arr.filter(r => r.pres || r.pag || r.pen);
  return arr;
}
function totales(m) {
  m = m || MON;
  const orig = S.partidas.reduce((s, p) => s + origenM(p, m), 0);
  const pres = S.partidas.reduce((s, p) => s + vPm(p, m), 0);
  const pag = S.egresos.filter(e => e.estado === 'Pagado').reduce((s, e) => s + vEm(e, m), 0);
  const pen = S.egresos.filter(e => e.estado !== 'Pagado').reduce((s, e) => s + vEm(e, m), 0);
  const apo = S.ingresos.filter(i => i.estado === 'Recibido').reduce((s, i) => s + vEm(i, m), 0);
  const apoPen = S.ingresos.filter(i => i.estado !== 'Recibido').reduce((s, i) => s + vEm(i, m), 0);
  return {orig, pres, mod: pres - orig, pag, pen, saldo: pres - pag - pen, apo, apoPen, caja: apo - pag};
}

/* ---- CAC ---- */
const cacVal = (mes, tipo) => { const r = S.cac.find(c => c.mes === mes); return r ? (r[CAC_COL[tipo || 'general']] || 0) : 0; };
const cacUltimo = tipo => { for (let i = S.cac.length - 1; i >= 0; i--) if (S.cac[i][CAC_COL[tipo || 'general']]) return S.cac[i]; return null; };
function inflAuto() {
  const r = S.cac.filter(c => c.general).slice(-4);
  if (r.length < 2) return 0;
  return (Math.pow(r[r.length - 1].general / r[0].general, 1 / (r.length - 1)) - 1) * 100;
}
const inflMes = () => (+S.obra.inflMensual > 0 ? +S.obra.inflMensual : inflAuto());
function cacPropuesta(p) {
  if (!p.cacTipo || p.moneda !== 'ARS') return null;
  const base = p.cacBase || (p.fechaConf || p.fechaCarga || '').slice(0, 7);
  const u = cacUltimo(p.cacTipo);
  if (!base) return {error: 'Falta el mes base (cargá la fecha de confirmación)'};
  const ib = cacVal(base, p.cacTipo);
  if (!ib) return {error: 'El mes base ' + nombreMes(base) + ' está fuera de la serie CAC cargada'};
  if (!u) return {error: 'No hay índice CAC cargado'};
  const sinCac = p.monto + S.modif.filter(m => m.partidaId === p.id && m.aprobado && m.tipo !== 'Actualización CAC').reduce((s, m) => s + m.monto, 0);
  const aplicado = S.modif.filter(m => m.partidaId === p.id && m.aprobado && m.tipo === 'Actualización CAC').reduce((s, m) => s + m.monto, 0);
  const teorico = sinCac * cacVal(u.mes, p.cacTipo) / ib;
  return {base, hasta: u.mes, factor: cacVal(u.mes, p.cacTipo) / ib - 1, sinCac, teorico, aplicado, propuesta: teorico - sinCac - aplicado};
}
function riesgoCac(p) {
  if (!p.cacTipo || p.moneda !== 'ARS') return 0;
  const V = vigenteNat(p), R = Math.max(0, V - ejecutadoNat(p).tot), r = inflMes() / 100;
  if (R <= 0 || !r) return 0;
  const h = hoy(), fut = pagosCalc(p).filter(x => x.fecha && x.fecha > h);
  let w = 0, acc = 0;
  fut.forEach(x => { const mm = Math.max(0, difDias(h, x.fecha) / 30.4); w += x.monto; acc += x.monto * (Math.pow(1 + r, mm) - 1); });
  return R * (w > 0 ? acc / w : Math.pow(1 + r, 3) - 1);
}
function proyeccionPartida(p) {
  const V = vigenteNat(p), I = ejecutadoNat(p).tot, pr = cacPropuesta(p);
  const cac = riesgoCac(p) + Math.max(0, (pr && pr.propuesta) || 0), base = Math.max(V, I);
  return {V, I, base, cac, eac: base + cac, desv: base + cac - V};
}
function proyeccionObra() {
  let vig = 0, proy = 0, cacExp = 0;
  S.gremios.forEach(g => {
    const ps = S.partidas.filter(p => p.gremioId === g.id);
    const vG = ps.reduce((s, p) => s + vP(p), 0);
    const iG = S.egresos.filter(e => e.gremioId === g.id).reduce((s, e) => s + vE(e), 0);
    const cG = ps.reduce((s, p) => s + conv(proyeccionPartida(p).cac, p.moneda, S.obra.tc, MON), 0);
    vig += vG; cacExp += cG; proy += Math.max(vG, iG) + cG;
  });
  const sinGremio = S.egresos.filter(e => !gremio(e.gremioId)).reduce((s, e) => s + vE(e), 0);
  proy += sinGremio;
  return {vig, proy, cacExp, desv: proy - vig};
}
function avanceGlobal() {
  const tot = S.partidas.reduce((s, p) => s + vP(p), 0);
  return tot ? S.partidas.reduce((s, p) => s + vP(p) * (+p.avance || 0), 0) / tot : 0;
}

/* ---- Alertas ---- */
const UMBRAL = 0.9;
function alertasGremios() {
  return agrupar('gremio').map(r => {
    const inc = r.pag + r.pen, desv = inc - r.pres;
    if (r.pres > 0 && inc > r.pres + 0.5) return {nivel: 'bad', k: r.k, pres: r.pres, inc, desv, txt: 'superó el presupuesto vigente'};
    if (r.pres <= 0 && inc > 0.5) return {nivel: 'bad', k: r.k, pres: 0, inc, desv: inc, txt: 'tiene egresos y no tiene presupuesto cargado'};
    if (r.pres > 0 && inc >= r.pres * UMBRAL) return {nivel: 'warn', k: r.k, pres: r.pres, inc, desv, txt: 'consumió ' + pct(inc / r.pres * 100) + ' del presupuesto vigente'};
    return null;
  }).filter(Boolean).sort((a, b) => (a.nivel === b.nivel ? b.desv - a.desv : (a.nivel === 'bad' ? -1 : 1)));
}
const nivelGremio = nombre => { const a = alertasGremios().find(x => x.k === nombre); return a ? a.nivel : ''; };
function alertasPartidas() {
  const out = [];
  S.partidas.forEach(p => {
    const V = vigenteNat(p), ej = ejecutadoNat(p), nm = gNombre(p.gremioId) + ' · ' + (p.desc || 'partida');
    if (ej.tot <= 0 || V <= 0) return;
    if (ej.tot > V + 0.5) out.push({nivel: 'bad', html: `<b>${esc(nm)}</b>: ejecutado ${moneyM(ej.tot, p.moneda)} sobre un contrato vigente de ${moneyM(V, p.moneda)} (<b>exceso ${moneyM(ej.tot - V, p.moneda)}</b>, medido en la moneda del contrato).`});
    else if (ej.tot >= V * UMBRAL) out.push({nivel: 'warn', html: `<b>${esc(nm)}</b>: ejecutado ${pct(ej.tot / V * 100)} del contrato (${moneyM(ej.tot, p.moneda)} de ${moneyM(V, p.moneda)}).`});
    if (p.avance > 0 && ej.tot / V * 100 - p.avance > 25) out.push({nivel: 'warn', html: `<b>${esc(nm)}</b>: pagado ${pct(ej.tot / V * 100)} contra un avance físico de ${pct(p.avance)} (anticipo o pago por delante de la obra).`});
  });
  return out;
}
function bannerAlertas() {
  const g = alertasGremios(), t = totales(), ap = alertasPartidas();
  const tot = t.pres > 0 && t.pag + t.pen > t.pres + 0.5 ? `<li><b>Obra completa</b>: lo incurrido ${money(t.pag + t.pen)} supera el presupuesto vigente ${money(t.pres)} (exceso ${money(t.pag + t.pen - t.pres)}).</li>` : '';

  const bad = g.filter(a => a.nivel === 'bad'), warn = g.filter(a => a.nivel === 'warn');

/* ---- Caja ---- */
function cajaCalc() {
  const mov = {}, pen = {};
  const get = k => mov[k] || (mov[k] = {apoA: 0, apoU: 0, egA: 0, egU: 0, apo: 0, eg: 0});
  const getP = k => pen[k] || (pen[k] = {A: 0, U: 0, c: 0});
  S.ingresos.filter(i => i.estado === 'Recibido' && i.fecha).forEach(i => {
    if (CORTE && i.fecha > CORTE) return;
    const r = get(i.fecha.slice(0, 7)); if (i.moneda === 'ARS') r.apoA += i.importe; else r.apoU += i.importe; r.apo += vE(i);
  });
  S.egresos.filter(e => e.estado === 'Pagado' && e.fecha).forEach(e => {
    if (CORTE && e.fecha > CORTE) return;
    const r = get(e.fecha.slice(0, 7)); if (e.moneda === 'ARS') r.egA += e.importe; else r.egU += e.importe; r.eg += vE(e);
  });
  S.egresos.filter(e => e.estado !== 'Pagado' && e.fecha).forEach(e => {
    const r = getP(e.fecha.slice(0, 7)); if (e.moneda === 'ARS') r.A += e.importe; else r.U += e.importe; r.c += vE(e);
  });
  const keys = Object.keys(mov).sort(), filas = [];
  let sA = 0, sU = 0, sC = 0;
  if (keys.length) {
    let k = keys[0]; const fin = keys[keys.length - 1];
    while (k <= fin) {
      const r = mov[k] || {apoA: 0, apoU: 0, egA: 0, egU: 0, apo: 0, eg: 0};
      const iniC = sC; sA += r.apoA - r.egA; sU += r.apoU - r.egU; sC += r.apo - r.eg;
      filas.push({k, iniC, ...r, sA, sU, sC}); k = sumarMes(k, 1);
    }
  }
  const plan = planPorMes(), mh = hoy().slice(0, 7);
  const futuros = [...new Set([...Object.keys(pen), ...Object.keys(plan)])].filter(k => k >= mh).sort();
  let proj = sC; const proy = [];
  futuros.forEach(k => {
    const p = pen[k] || {A: 0, U: 0, c: 0}, prog = plan[k] || 0, pagMes = (mov[k] || {eg: 0}).eg;
    const req = Math.max(prog - pagMes, p.c), disp = Math.max(proj, 0), aporte = Math.max(0, req - disp);
    proy.push({k, prog, pend: p.c, req, disp, aporte}); proj = disp + aporte - req;
  });
  return {filas, proy, sA, sU, sC};
}

/* ---- Dólar blue (venta) de referencia ---- */
async function traerDolar(forzar) {
  try { const c = JSON.parse(lsGet(KEY_DOL, 'null')); if (!forzar && c && Date.now() - c.t < 30 * 60e3) return c; } catch (e) { /* sigue */ }
  const r = await fetch('https://dolarapi.com/v1/dolares/blue', {cache: 'no-store'});
  if (!r.ok) throw new Error('http ' + r.status);
  const d = await r.json(), v = Number(d.venta);
  if (!v) throw new Error('sin venta');
  const c = {venta: v, compra: Number(d.compra) || 0, fecha: d.fechaActualizacion || '', t: Date.now()};
  lsSet(KEY_DOL, JSON.stringify(c));
  return c;
}

/* ============ Contratos ============ */
function vContratos() {
  const grupos = {};

  let h = `<div class="titulo"><h2>Cuenta corriente por contratista</h2></div>
  <p class="sub">Cada contrato se mide en su propia moneda, para que una variación del dólar no se confunda con un exceso de gasto. El avance físico lo cargás vos al certificar; el proyectado suma el ajuste esperado por CAC a lo que falta pagar.</p>`;
  if (!keys.length) return h + '<div class="vacio">Sin contratos. Cargá partidas con su contratista en Presupuesto.</div>';
  h += '<div class="tw"><table><thead><tr><th>Contratista / partida</th><th class="n">Vigente</th><th class="n">Pagado</th><th class="n">Pendiente</th><th class="n">Por ejecutar</th><th class="n">% pagado</th><th class="n">Avance físico</th><th class="n">Brecha</th><th class="n">Proyectado</th><th class="n">Riesgo CAC</th></tr></thead><tbody>';
  keys.forEach(k => {

    h += `<tr class="sub"><td>${esc(k)}</td><td class="n">${money(sV)}</td><td colspan="2" class="n">${money(sI)} incurrido</td><td class="n">${money(Math.max(0, sV - sI))}</td><td class="n">${sV ? pct(sI / sV * 100) : '—'}</td><td></td><td></td><td class="n">${money(sPr)}</td><td></td></tr>`;
    ps.forEach(p => {
      const V = vigenteNat(p), ej = ejecutadoNat(p), pr = proyeccionPartida(p), m = p.moneda, pc = V ? ej.tot / V * 100 : 0, brecha = p.avance > 0 ? pc - p.avance : null;
      const niv = ej.tot > V + 0.5 ? 'bad' : (V > 0 && ej.tot >= V * UMBRAL ? 'warn' : '');
      h += `<tr><td class="ind dos">${esc(gNombre(p.gremioId))} · ${esc(p.desc || 'partida')} ${tagNivel(niv)}<small>${m}${p.cacTipo ? ' · ajusta por ' + esc(p.cacTipo) : ''}</small></td>
        <td class="n">${moneyM(V, m)}</td><td class="n">${moneyM(ej.pag, m)}</td><td class="n">${moneyM(ej.pen, m)}</td><td class="n">${moneyM(Math.max(0, V - ej.tot), m)}</td><td class="n">${pct(pc)}</td>
        <td class="n"><span class="edit"><input type="number" min="0" max="100" step="1" value="${p.avance || 0}" data-change="avance" data-id="${p.id}" style="width:66px" aria-label="Avance físico de ${esc(p.desc)}"> %</span><span class="ro">${p.avance || 0} %</span></td>
        <td class="n ${brecha !== null && brecha > 25 ? 'neg' : ''}">${brecha === null ? '—' : (brecha > 0 ? '+' : '') + fmt(brecha) + ' pp'}</td>
        <td class="n"><b>${moneyM(pr.eac, m)}</b></td><td class="n ${pr.cac > 0 ? 'neg' : ''}">${pr.cac > 0 ? moneyM(pr.cac, m) : '—'}</td></tr>`;

  h += '</tbody></table></div><p class="nota">Brecha = % pagado menos avance físico, en puntos porcentuales. Una brecha alta indica anticipos o pagos por delante de la obra. Sin avance cargado no se calcula.</p>';

}

/* ============ Flujo de fondos ============ */
function vFlujo() {
  const plan = planPorMes(), real = {}, apo = {};
  S.egresos.forEach(e => { const k = (e.fecha || '').slice(0, 7); if (!k) return; const r = real[k] || (real[k] = {pag: 0, pen: 0}); if (e.estado === 'Pagado') r.pag += vE(e); else r.pen += vE(e); });
  S.ingresos.filter(i => i.estado === 'Recibido').forEach(i => { const k = (i.fecha || '').slice(0, 7); if (k) apo[k] = (apo[k] || 0) + vE(i); });
  const keys = [...new Set([...Object.keys(real), ...Object.keys(plan), ...Object.keys(apo)])].sort();
  if (!keys.length) return '<div class="titulo"><h2>Flujo de fondos</h2></div><div class="vacio">Cargá egresos y definí el flujo de pagos de cada partida para ver el flujo.</div>';
  const meses = []; for (let k = keys[0]; k <= keys[keys.length - 1]; k = sumarMes(k, 1)) meses.push(k);
  let aP = 0, aR = 0, aA = 0;
  const filas = meses.map(k => { const r = real[k] || {pag: 0, pen: 0}, pl = plan[k] || 0, tot = r.pag + r.pen, ap = apo[k] || 0; aP += pl; aR += tot; aA += ap; return {k, pl, pag: r.pag, pen: r.pen, tot, aP, aR, ap, aA}; });
  const sinPlan = S.partidas.filter(p => !planMeses(p).length).length, t = totales();
  after.push(() => {
    chart('chFm', {type: 'bar', data: {labels: filas.map(f => nombreMes(f.k)), datasets: [
      {label: 'Programado', data: filas.map(f => f.pl), backgroundColor: cv('--prog'), stack: 'plan', borderRadius: 2},
      {label: 'Pagado', data: filas.map(f => f.pag), backgroundColor: cv('--s1'), stack: 'real', borderRadius: 2},
      {label: 'Pendiente', data: filas.map(f => f.pen), backgroundColor: cv('--s2'), stack: 'real', borderRadius: 2}]},
      options: {plugins: {legend: {position: 'bottom'}}, scales: {y: {beginAtZero: true}}}});
    chart('chFa', {type: 'line', data: {labels: filas.map(f => nombreMes(f.k)), datasets: [
      {label: 'Programado acumulado', data: filas.map(f => f.aP), borderColor: cv('--grafito'), borderDash: [6, 4], pointRadius: 2, borderWidth: 2, tension: 0},
      {label: 'Real acumulado (pagado + pendiente)', data: filas.map(f => f.aR), borderColor: cv('--s1'), backgroundColor: cv('--s1'), pointRadius: 3, borderWidth: 2, tension: 0},
      {label: 'Aportes recibidos acumulados', data: filas.map(f => f.aA), borderColor: cv('--s3'), backgroundColor: cv('--s3'), pointRadius: 3, borderWidth: 2, tension: 0}]},
      options: {plugins: {legend: {position: 'bottom'}}, interaction: {mode: 'index', intersect: false}, scales: {y: {beginAtZero: true}}}});
  });
  return `<div class="titulo"><h2>Flujo de fondos (${MON})</h2></div>
  <p class="sub">Programado surge del flujo de pagos acordado en cada contrato, con las fechas corridas según el inicio de cada etapa. Real son los egresos cargados en el mes de su fecha.${sinPlan ? ` Hay ${sinPlan} partida(s) sin flujo de pagos definido que no aparecen en lo programado.` : ''}</p>
  <div class="dosc"><div><h3 class="sec" style="margin-top:0">Por mes</h3><div class="chart"><canvas id="chFm" role="img" aria-label="Flujo mensual programado, pagado y pendiente"></canvas></div></div>
  <div><h3 class="sec" style="margin-top:0">Acumulado</h3><div class="chart"><canvas id="chFa" role="img" aria-label="Flujo acumulado programado, real y aportes"></canvas></div></div></div>
  <h3 class="sec">Detalle mensual</h3>
  <div class="tw"><table><thead><tr><th>Mes</th><th class="n">Programado</th><th class="n">Pagado</th><th class="n">Pendiente</th><th class="n">Real del mes</th><th class="n">Real − programado</th><th class="n">Acum. programado</th><th class="n">Acum. real</th><th class="n">% del vigente</th><th class="n">Aportes</th><th class="n">Aportes − real (acum.)</th></tr></thead><tbody>
  ${filas.map(f => `<tr><td>${nombreMes(f.k)}</td><td class="n">${money(f.pl)}</td><td class="n">${money(f.pag)}</td><td class="n">${money(f.pen)}</td><td class="n">${money(f.tot)}</td><td class="n ${f.tot - f.pl > 0.5 ? 'neg' : (f.tot - f.pl < -0.5 ? 'pos' : '')}">${money(f.tot - f.pl)}</td><td class="n">${money(f.aP)}</td><td class="n">${money(f.aR)}</td><td class="n">${t.pres ? pct(f.aR / t.pres * 100) : '—'}</td><td class="n">${money(f.ap)}</td><td class="n ${f.aA - f.aR < -0.5 ? 'neg' : 'pos'}">${money(f.aA - f.aR)}</td></tr>`).join('')}
  <tr class="tot"><td>Total</td><td class="n">${money(aP)}</td><td class="n">${money(t.pag)}</td><td class="n">${money(t.pen)}</td><td class="n">${money(t.pag + t.pen)}</td><td class="n">${money(t.pag + t.pen - aP)}</td><td></td><td></td><td></td><td class="n">${money(aA)}</td><td></td></tr></tbody></table></div>`;
}

/* ============ Gantt de desembolsos ============ */
function vGantt() {
  const LW = 232, h = hoy(), fechas = [h];
  S.etapas.forEach(e => { if (e.inicio) fechas.push(e.inicio); const f = etapaFin(e); if (f) fechas.push(f); });
  S.partidas.forEach(p => { if (p.fechaConf) fechas.push(p.fechaConf, addDias(p.fechaConf, +p.diasEntrega || 0)); pagosCalc(p).forEach(x => { if (x.fecha) fechas.push(x.fecha); }); });
  S.egresos.forEach(e => { if (e.fecha) fechas.push(e.fecha); });
  const cab = `<div class="titulo"><h2>Desembolsos en el tiempo</h2><div class="sp"></div><label class="hint" for="selZ">Escala</label><select id="selZ" data-change="gz">${[[2.2, 'Compacta'], [3.4, 'Normal'], [5.2, 'Amplia']].map(([v, l]) => `<option value="${v}" ${GZ === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
  if (!S.partidas.length && !S.egresos.length) return cab + '<div class="vacio">Cargá partidas con su flujo de pagos y las fechas de inicio de cada etapa para ver el Gantt.</div>';
  const ini = fechas.reduce((a, b) => a < b ? a : b), fin = fechas.reduce((a, b) => a > b ? a : b);
  const d0 = ini.slice(0, 7) + '-01', d1 = sumarMes(fin.slice(0, 7), 1) + '-01', ppd = GZ, W = Math.round(difDias(d0, d1) * ppd), X = f => difDias(d0, f) * ppd;
  const meses = []; for (let k = d0.slice(0, 7); k < d1.slice(0, 7); k = sumarMes(k, 1)) meses.push(k);
  const cabecera = `<div class="gr cab" style="height:40px"><div class="gl" style="width:${LW}px">Gremio y etapa<small>${fd(d0)} a ${fd(addDias(d1, -1))}</small></div><div class="gx" style="width:${W}px">${meses.map(k => { const w = difDias(k + '-01', sumarMes(k, 1) + '-01') * ppd; return `<div class="gm ${k.endsWith('-01') || k === meses[0] ? 'a' : ''}" style="left:${X(k + '-01')}px;width:${w}px">${k.endsWith('-01') || k === meses[0] ? nombreMes(k) : nombreMes(k).slice(0, 3)}</div>`; }).join('')}</div></div>`;
  let filas = '';
  const planMes = {}, realMes = {};
  S.etapas.forEach(et => {
    const gs = S.gremios.filter(g => g.etapaId === et.id && (S.partidas.some(p => p.gremioId === g.id) || S.egresos.some(e => e.gremioId === g.id)));
    if (!gs.length && !et.inicio) return;
    const ef = etapaFin(et);
    filas += `<div class="gr et" style="height:46px"><div class="gl" style="width:${LW}px">${esc(et.nombre)}<small>${et.inicio ? fd(et.inicio) + ' → ' + (ef ? fd(ef) : 'sin plazo') : 'sin fecha de inicio'}</small></div><div class="gx" style="width:${W}px">${et.inicio ? `<div class="gbar etp" style="left:${X(et.inicio)}px;width:${Math.max(5, ef ? X(ef) - X(et.inicio) : 5)}px" data-tip="${esc(et.nombre)}: inicio ${fd(et.inicio)}${ef ? ', fin ' + fd(ef) + ' (' + et.dias + ' días)' : ''}"></div>` : ''}</div></div>`;
    gs.forEach(g => {
      const ps = S.partidas.filter(p => p.gremioId === g.id);
      const leads = ps.filter(p => p.fechaConf && +p.diasEntrega > 0).map(p => [p.fechaConf, addDias(p.fechaConf, +p.diasEntrega)]);
      const lead = leads.length ? [leads.map(x => x[0]).sort()[0], leads.map(x => x[1]).sort().slice(-1)[0]] : null;
      const tv = ps.reduce((s, p) => s + vP(p), 0), av = tv ? ps.reduce((s, p) => s + vP(p) * (+p.avance || 0), 0) / tv : 0;
      let marks = '';
      ps.forEach(p => pagosCalc(p).filter(x => x.fecha).forEach(x => {
        const v = conv(x.monto, p.moneda, p.tc, MON), k = x.mes; planMes[k] = (planMes[k] || 0) + v;
        marks += `<div class="gdi ${x.fecha <= h ? 'pas' : ''}" style="left:${X(x.fecha)}px;${x.fecha <= h ? 'background:var(--tinta)' : ''}" data-tip="Programado ${fd(x.fecha)} · ${esc(p.desc || 'partida')} · ${esc(x.concepto || 'pago')} (${fmt(+x.pct)} %) · ${money(v)}"></div>`;
      }));
      S.egresos.filter(e => e.gremioId === g.id && e.fecha).forEach(e => {
        const v = vE(e), k = e.fecha.slice(0, 7), r = realMes[k] || (realMes[k] = {p: 0, q: 0}); if (e.estado === 'Pagado') r.p += v; else r.q += v;
        marks += `<div class="gci ${e.estado === 'Pagado' ? 'p' : 'q'}" style="left:${X(e.fecha)}px" data-tip="${esc(e.estado)} ${fd(e.fecha)} · ${esc(e.proveedor || 'egreso')} · ${esc(e.concepto)} · ${money(v)}"></div>`;
      });
      const nombres = ps.length ? ps.length + (ps.length === 1 ? ' partida' : ' partidas') : 'sin partidas';
      filas += `<div class="gr" style="height:68px"><div class="gl" style="width:${LW}px">${esc(g.nombre)}<small>${nombres}${av ? ' · avance ' + fmt(av) + ' %' : ''}</small></div><div class="gx" style="width:${W}px">
        ${lead ? `<div class="gbar lead" style="left:${X(lead[0])}px;width:${Math.max(4, X(lead[1]) - X(lead[0]))}px" data-tip="Provisión: confirmación ${fd(lead[0])} → entrega ${fd(lead[1])}"></div>` : ''}
        ${et.inicio && ef ? `<div class="gbar ej" style="left:${X(et.inicio)}px;width:${Math.max(4, X(ef) - X(et.inicio))}px" data-tip="Ejecución de ${esc(et.nombre)}: ${fd(et.inicio)} → ${fd(ef)}${av ? ' · avance ' + fmt(av) + ' %' : ''}"><u style="width:${Math.min(100, av)}%"></u></div>` : ''}${marks}</div></div>`;
    });
  });
  const mxP = Math.max(1, ...meses.map(k => planMes[k] || 0)), mxR = Math.max(1, ...meses.map(k => (realMes[k] ? realMes[k].p + realMes[k].q : 0)));
  const bars = (src, mx, tipo) => meses.map(k => {
    const w = difDias(k + '-01', sumarMes(k, 1) + '-01') * ppd, l = X(k + '-01');
    if (tipo === 'plan') { const v = planMes[k] || 0; return v ? `<div class="gsum" style="left:${l}px;width:${w}px;height:100%" data-tip="Programado ${nombreMes(k)}: ${money(v)}"><i style="height:${Math.max(3, v / mx * 52)}px;background:var(--prog)"></i></div>` : ''; }
    const r = realMes[k]; if (!r) return '';
    return `<div class="gsum" style="left:${l}px;width:${w}px;height:100%" data-tip="Real ${nombreMes(k)}: pagado ${money(r.p)} · pendiente ${money(r.q)}"><div style="width:calc(100% - 10px)"><i style="width:100%;height:${r.q / mx * 52}px;background:var(--s2);margin-bottom:${r.q ? 2 : 0}px"></i><i style="width:100%;height:${r.p / mx * 52}px;background:var(--s1)"></i></div></div>`;
  }).join('');
  const resumen = `<div class="gr" style="height:74px;border-top:1.5px solid var(--tinta)"><div class="gl" style="width:${LW}px">Programado por mes<small>pico ${money(mxP)}</small></div><div class="gx" style="width:${W}px">${bars(planMes, mxP, 'plan')}</div></div>
    <div class="gr" style="height:74px"><div class="gl" style="width:${LW}px">Real por mes<small>pagado y pendiente · pico ${money(mxR)}</small></div><div class="gx" style="width:${W}px">${bars(realMes, mxR, 'real')}</div></div>`;
  const grid = `<div class="gg" style="left:${LW}px;width:${W}px">${meses.map(k => `<i style="left:${X(k + '-01')}px"></i>`).join('')}<i class="hoy" style="left:${X(h)}px" data-tip="Hoy ${fd(h)}"></i></div>`;
  return cab + `<div class="leyenda">
    <span><i style="background:var(--tinta);height:7px;vertical-align:2px"></i>Etapa</span>
    <span><i style="background:var(--azul-bg);border:1px solid var(--azul);height:10px"></i>Ejecución del gremio (relleno = avance)</span>
    <span><i style="background:repeating-linear-gradient(135deg,var(--trazo) 0 2px,transparent 2px 5px);border:1px solid var(--trazo)"></i>Provisión (confirmación a entrega)</span>
    <span><i style="border:2px solid var(--tinta);width:9px;height:9px;transform:rotate(45deg)"></i>Pago programado (relleno si la fecha ya pasó)</span>
    <span><i style="background:var(--s1);border-radius:50%"></i>Pagado</span><span><i style="background:var(--s2);border-radius:50%"></i>Pendiente</span>
    <span><i style="background:var(--crit);width:3px"></i>Hoy</span></div>
  <div class="gw"><div class="gb" style="width:${LW + W}px">${cabecera}${grid}${filas}${resumen}</div></div>
  <p class="nota">Las fechas de los pagos programados se calculan desde la confirmación, la entrega o el inicio de cada etapa, más los días acordados. Si una etapa se atrasa, cambiá su fecha de inicio en Configuración y todo el flujo se corre solo.</p>`;
}

/* ============ Índice CAC ============ */
function vCac() {
  const c = S.cac, u = c[c.length - 1], ant = c[c.length - 2];
  const v = (a, b, k) => (a && b && a[k] && b[k]) ? (a[k] / b[k] - 1) * 100 : null;
  const anio = c.find(x => x.mes === u.mes.slice(0, 4) + '-01'), dic = c.find(x => x.mes === (+u.mes.slice(0, 4) - 1) + '-12'), ia = c.find(x => x.mes === sumarMes(u.mes, -12));
  const f1 = x => x === null ? '—' : (x >= 0 ? '+' : '') + fmt1(x) + ' %';
  const acum = v(u, dic, 'general');
  after.push(() => {
    const dat = c.slice(1);
    chart('chCac', {type: 'line', data: {labels: dat.map(x => nombreMes(x.mes)), datasets: [
      {label: 'General', data: dat.map((x, i) => v(x, c[i], 'general')), borderColor: cv('--s1'), backgroundColor: cv('--s1'), borderWidth: 2, pointRadius: 3, tension: 0},
      {label: 'Mano de obra', data: dat.map((x, i) => v(x, c[i], 'mo')), borderColor: cv('--s2'), backgroundColor: cv('--s2'), borderWidth: 2, pointRadius: 3, tension: 0},
      {label: 'Materiales', data: dat.map((x, i) => v(x, c[i], 'mat')), borderColor: cv('--s3'), backgroundColor: cv('--s3'), borderWidth: 2, pointRadius: 3, tension: 0}]},
      options: {plugins: {legend: {position: 'bottom'}}, interaction: {mode: 'index', intersect: false}, scales: {y: {title: {display: true, text: 'Variación mensual (%)'}}}}});
  });
  const prop = S.partidas.filter(p => p.cacTipo && p.moneda === 'ARS');
  const sinIdx = S.partidas.filter(p => !p.cacTipo && p.moneda === 'ARS').length;
  return `<div class="titulo"><h2>Costo de la construcción (CAC)</h2><div class="sp"></div><button class="btn pri edit" data-act="cacMes">Cargar mes</button></div>
  <p class="sub">Índice mensual de la Cámara Argentina de la Construcción, usado para actualizar los precios de los gremios. Lo ves acá y lo aplicás a cada contrato que tenga «ajusta por CAC».</p>
  <div class="lect">
    <div><small>Último índice (${nombreMes(u.mes)})</small><b>${fmt1(u.general)}</b><em>puntos, base dic. 2014 = 100</em></div>
    <div><small>Variación del mes</small><b>${f1(v(u, ant, 'general'))}</b><em>mano de obra ${f1(v(u, ant, 'mo'))} · materiales ${f1(v(u, ant, 'mat'))}</em></div>
    <div><small>Acumulado del año</small><b>${f1(acum)}</b><em>mano de obra ${f1(v(u, dic, 'mo'))} · materiales ${f1(v(u, dic, 'mat'))}</em></div>
    <div><small>Interanual</small><b>${f1(v(u, ia, 'general'))}</b><em>${ia ? 'contra ' + nombreMes(ia.mes) : 'sin dato de hace 12 meses'}</em></div>
    <div><small>Ritmo usado en la proyección</small><b>${fmt2(inflMes())} %</b><em>por mes · ${+S.obra.inflMensual > 0 ? 'fijado a mano' : 'promedio de los últimos 3 meses'}</em></div>
  </div>
  <h3 class="sec">Variación mensual</h3><div class="chart" style="height:280px"><canvas id="chCac" role="img" aria-label="Variación mensual del índice CAC general, mano de obra y materiales"></canvas></div>
  <h3 class="sec">Actualización de contratos por CAC</h3>
  <p class="nota">Teórico = (contrato original + adicionales) × índice actual ÷ índice del mes de confirmación. Propuesta = teórico − lo ya aplicado. Al aplicarla se crea una modificación «Actualización CAC» aprobada, que sube el presupuesto vigente.${sinIdx ? ` Hay ${sinIdx} partida(s) en pesos sin ajuste por CAC; se configuran al editar la partida.` : ''}</p>
  ${prop.length ? `<div class="tw"><table><thead><tr><th>Partida</th><th>Índice</th><th>Mes base</th><th class="n">Variación</th><th class="n">Contrato sin CAC</th><th class="n">Teórico</th><th class="n">Ya aplicado</th><th class="n">Propuesta</th><th class="edit"></th></tr></thead><tbody>
  ${prop.map(p => { const r = cacPropuesta(p); if (r.error) return `<tr><td class="dos">${esc(p.desc || 'partida')}<small>${esc(gNombre(p.gremioId))}</small></td><td>${esc(p.cacTipo)}</td><td colspan="6"><span class="tag q">${esc(r.error)}</span></td><td class="edit"></td></tr>`;
    return `<tr><td class="dos">${esc(p.desc || 'partida')}<small>${esc(gNombre(p.gremioId))}</small></td><td>${esc(p.cacTipo)}</td><td>${nombreMes(r.base)}</td><td class="n">${f1(r.factor * 100)}</td><td class="n">$ ${fmt(r.sinCac)}</td><td class="n">$ ${fmt(r.teorico)}</td><td class="n">$ ${fmt(r.aplicado)}</td><td class="n"><b>${r.propuesta >= 0 ? '+' : ''}$ ${fmt(r.propuesta)}</b></td><td class="edit n">${Math.abs(r.propuesta) > 1 ? `<button class="btn mini" data-act="aplicarCac" data-id="${p.id}">Aplicar</button>` : '<span class="hint">al día</span>'}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="vacio">Ninguna partida en pesos tiene ajuste por CAC. Elegí el índice al editar la partida.</div>'}
  <h3 class="sec">Serie cargada</h3>
  <div class="tw"><table><thead><tr><th>Mes</th><th class="n">General</th><th class="n">Var. %</th><th class="n">Mano de obra</th><th class="n">Var. %</th><th class="n">Materiales</th><th class="n">Var. %</th><th class="edit"></th></tr></thead><tbody>
  ${[...c].reverse().map((x, i, arr) => { const pr = arr[i + 1]; return `<tr><td>${nombreMes(x.mes)}</td><td class="n">${fmt1(x.general)}</td><td class="n">${f1(v(x, pr, 'general'))}</td><td class="n">${x.mo ? fmt1(x.mo) : '—'}</td><td class="n">${f1(v(x, pr, 'mo'))}</td><td class="n">${x.mat ? fmt1(x.mat) : '—'}</td><td class="n">${f1(v(x, pr, 'mat'))}</td><td class="edit n"><button class="btn mini" data-act="editCacMes" data-id="${x.mes}">Editar</button> <button class="btn mini del" data-act="delCacMes" data-id="${x.mes}">Borrar</button></td></tr>`; }).join('')}</tbody></table></div>
  <p class="nota">${esc(CAC_FUENTE)}</p>`;
}

      hint.textContent = 'Buscando…';

async function publicarJob(c) {
  const est = document.createElement('p'); est.className = 'hint'; est.id = 'pubEstado'; est.setAttribute('role', 'status'); $('#modal form').appendChild(est);
  const say = t => { est.textContent = t; };
  try {
    const [owner, repo] = c.repo.trim().split('/'); if (!owner || !repo) throw new Error('El repositorio debe tener el formato usuario/nombre.');
    if (!crypto || !crypto.subtle) throw new Error('Este navegador no permite cifrar desde esta página.');
    const H = {Authorization: 'Bearer ' + c.token.trim(), Accept: 'application/vnd.github+json'};
    const base = `https://api.github.com/repos/${owner}/${repo}/contents/`;
    const put = async (path, b64c, msg) => {
      let sha; const g = await fetch(base + path + '?ref=' + encodeURIComponent(c.branch), {headers: H});
      if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error('GitHub respondió ' + g.status + (g.status === 401 ? ' (token inválido)' : g.status === 403 ? ' (sin permiso)' : ''));
      const r = await fetch(base + path, {method: 'PUT', headers: {...H, 'Content-Type': 'application/json'}, body: JSON.stringify({message: msg, content: b64c, branch: c.branch, ...(sha ? {sha} : {})})});
      if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) { /* noop */ } throw new Error('No se pudo subir ' + path + ': ' + (m || r.status)); }
    };
    const ch = await sha(c.clave + '|' + saltLocal().join('.')), prev = JSON.parse(lsGet(KEY_GH, '{}'));
    if (c.auto && prev.ch && prev.ch !== ch) { c.todas = 'si'; say('La clave cambió: se reenviarán todos los archivos.'); }
    c.ch = ch;
    say('Cifrando datos…');
    const salt = saltLocal(), key = await derivar(c.clave, salt);
    const {iv, ct} = await cifrarBytes(new TextEncoder().encode(JSON.stringify(S)), key);
    const env = {v: 1, alg: 'AES-GCM/PBKDF2-SHA256', salt: b64(salt), iv: b64(iv), ct: b64(ct)};
    const pk = KEY_PUBF + ':' + c.repo; let pub = new Set(c.todas === 'si' ? [] : JSON.parse(lsGet(pk, '[]')));
    const ids = [...new Set(fotosIds())].filter(id => !pub.has(id));
    let i = 0;
    for (const id of ids) {
      i++; say(`Subiendo archivos cifrados ${i} de ${ids.length}…`);
      const blob = await fGet(id); if (!blob) continue;
      const e = await cifrarBytes(new Uint8Array(await blob.arrayBuffer()), key), out = new Uint8Array(12 + e.ct.length); out.set(e.iv, 0); out.set(e.ct, 12);
      await put('fotos/' + id + '.bin', b64(out), 'Archivo adjunto'); pub.add(id); lsSet(pk, JSON.stringify([...pub]));
    }
    say('Subiendo datos…');
    await put('data.json', b64(new TextEncoder().encode(JSON.stringify(env))), 'Actualización de datos de obra (Rev. ' + (S.rev || 0) + ')');
    lsSet(KEY_GH, JSON.stringify({repo: c.repo, branch: c.branch, token: c.token, ch: c.ch || await sha(c.clave + '|' + saltLocal().join('.')), ultima: Date.now()})); lsSet(KEY_EXP, Date.now());
    try { sessionStorage.setItem('obra_clave', c.clave); } catch (e2) { /* noop */ }
    logc('Publicación', c.repo + ' · ' + ids.length + ' fotos nuevas'); guardar();
    say('Publicado. En un par de minutos el propietario ve la versión nueva con su clave.');
    setTimeout(() => { $('#modal').innerHTML = ''; render(); }, 2200);
  } catch (e) { say('No se pudo publicar: ' + (e.message || e)); }
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;

    const it = S[lista].find(x => x.id === id); if (!it) return;
    if (it.fecha && ['egresos', 'ingresos'].includes(lista) && bloq(it.fecha)) return cerrado();
    if (!confirm(msg)) return;
    (it.fotos || []).forEach(f => fDel(f.id)); S[lista].splice(S[lista].indexOf(it), 1); logc('Borrado', desc(it)); guardar(); render();
  };
  if (a === 'vista') { VIEW = el.dataset.v; render(); window.scrollTo(0, 0); }
  else if (a === 'mon') { MON = el.dataset.v; lsSet(KEY_MON, MON); render(); }
  else if (a === 'cerrar') cerrarForm();
  else if (a === 'quitarFoto') { FT.lista = FT.lista.filter(f => f.id !== id); if (FT.nuevas.includes(id)) { FT.nuevas = FT.nuevas.filter(x => x !== id); fDel(id); } else FT.quitadas.push(id); pintarThumbs(); }
  else if (a === 'verFotos') verFotos(el.dataset.t, id);
  else if (a === 'nuevoEgreso') fEgreso();
  else if (a === 'editEgreso') fEgreso(S.egresos.find(x => x.id === id));
  else if (a === 'delEgreso') borrar('egresos', '¿Borrar este egreso y sus fotos?', e => `Egreso ${e.proveedor} ${e.moneda} ${fmt(e.importe)}`);
  else if (a === 'nuevaPartida') fPartida();
  else if (a === 'editPartida') fPartida(partida(id));
  else if (a === 'delPartida') { if (S.egresos.some(e => e.partidaId === id) && !confirm('Hay egresos imputados a esta partida; quedarán sin partida.')) return; S.egresos.forEach(e => { if (e.partidaId === id) e.partidaId = ''; }); S.modif = S.modif.filter(m => m.partidaId !== id); borrar('partidas', '¿Borrar esta partida, sus modificaciones y sus fotos?', p => `Partida ${p.desc}`); }
  else if (a === 'pagos') fPagos(partida(id));
  else if (a === 'nuevaModif') fModif();
  else if (a === 'editModif') fModif(S.modif.find(x => x.id === id));
  else if (a === 'delModif') borrar('modif', '¿Borrar esta modificación?', m => `Modificación ${m.tipo} ${fmt(m.monto)}`);

  else if (a === 'aplicarCac') {
    const p = partida(id), r = cacPropuesta(p); if (!r || r.error || Math.abs(r.propuesta) < 1) return;
    if (!confirm(`Se crea una actualización CAC de $ ${fmt(r.propuesta)} sobre «${p.desc}» (${nombreMes(r.base)} → ${nombreMes(r.hasta)}, ${fmt1(r.factor * 100)} %). ¿Aplicar?`)) return;

    logc('Actualización CAC', `${p.desc}: $ ${fmt(r.propuesta)}`); guardar(); render();
  }
  else if (a === 'nuevoIngreso') fIngreso();
  else if (a === 'editIngreso') fIngreso(S.ingresos.find(x => x.id === id));
  else if (a === 'delIngreso') borrar('ingresos', '¿Borrar este aporte y sus fotos?', i => `Aporte ${i.aportante} ${i.moneda} ${fmt(i.importe)}`);
  else if (a === 'nuevaEtapa') fEtapa();
  else if (a === 'editEtapa') fEtapa(etapa(id));

$('#fJSON').onchange = ev => {

document.addEventListener('mousemove', ev => { if (tip.style.display === 'block') { tip.style.left = Math.min(ev.clientX + 14, innerWidth - 330) + 'px'; tip.style.top = (ev.clientY + 16) + 'px'; } });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S) render(); }); } catch (e) { /* noop */ }

/* ============ Arranque ============ */
function promptClave(msg) {
  return new Promise(res => {
    $('#modal').innerHTML = `<div class="ov"><form class="md"><h3>Obra protegida</h3><p>${msg}</p><label class="in">Clave de acceso<input type="password" id="claveIn" required autocomplete="current-password"></label><div class="bt"><button class="btn pri">Entrar</button></div></form></div>`;
    $('#modal form').onsubmit = ev => { ev.preventDefault(); const v = $('#claveIn').value; $('#modal').innerHTML = ''; res(v); };
    $('#claveIn').focus();
  });
}
async function abrirCifrado(env) {
  ENC = true; let clave = ''; try { clave = sessionStorage.getItem('obra_clave') || ''; } catch (e) { /* noop */ }
  let msg = 'Ingresá la clave que te dio el administrador de la obra para ver el panel.';
  for (;;) {
    if (!clave) clave = await promptClave(msg);
    try {
      KEYC = await derivar(clave, unb64(env.salt));
      const pl = await descifrarBytes(unb64(env.iv), unb64(env.ct), KEYC);
      S = migrar(JSON.parse(new TextDecoder().decode(pl)));
      try { sessionStorage.setItem('obra_clave', clave); } catch (e) { /* noop */ }
      return;
    } catch (e) { msg = 'La clave no es correcta. Probá de nuevo.'; clave = ''; try { sessionStorage.removeItem('obra_clave'); } catch (e2) { /* noop */ } }
  }
}
async function init() {
  if (VISOR) {
    let d = null;
    try { const r = await fetch('data.json?t=' + Date.now()); d = await r.json(); } catch (e) { /* sin datos */ }
    if (d && d.alg) await abrirCifrado(d); else S = d && d.gremios ? migrar(d) : nuevoEstado();
  } else cargarLocal();
  render();
}
init();
